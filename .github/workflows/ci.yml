name: ci

on:
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang (the version in paka/clang-version)
        run: |
          v=$(cat paka/clang-version)
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/LLVM-$v-Linux-X64.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/LLVM-$v-Linux-X64/bin" >> "$GITHUB_PATH"
      - run: clang --version
      - run: cargo build --release --locked --offline
      - run: cargo test --release --locked --offline
      - run: cargo clippy --locked --offline --all-targets -- -D warnings
      - run: cargo fmt --check
