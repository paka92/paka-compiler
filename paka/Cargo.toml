[package]
name = "paka"
version = "0.0.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[features]
# Measurement-only builds (M6-30), never shipped: `paka build --omit bounds` and a timed runtime.
measure = ["paka-rt/measure"]

[dependencies]
paka-json = { path = "../json" }
paka-rt = { path = "../paka-rt" }
paka-gui = { path = "../gui" }
cranelift-codegen = { version = "=0.136.3", default-features = false, features = ["std", "x86"] }
cranelift-frontend = { version = "=0.136.3", default-features = false, features = ["std"] }

[dev-dependencies]
paka-gen = { path = "../paka-gen" }
