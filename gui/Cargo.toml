[package]
name = "paka-gui"
version = "0.0.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

# The crates and features docs/decisions/M5-08.md approves, pinned exactly.
[dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }
softbuffer = { version = "=0.4.8", default-features = false, features = ["wayland", "wayland-dlopen"] }
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "text", "u8_pipeline"] }
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
accesskit = "=0.25.2"
accesskit_winit = { version = "=0.34.2", default-features = false, features = ["accesskit_unix", "async-io", "rwh_06"] }
