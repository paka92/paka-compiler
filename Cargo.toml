[workspace]
resolver = "3"
members = ["paka", "paka-rt", "paka-gen", "harness", "json", "installer", "gui"]

[profile.dev]
overflow-checks = true

# Cranelift compiles each dev-mode program; unoptimized, it is the slow part of every test.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
overflow-checks = true
